[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-workspace-ft-cuda"
version = "0.2.0"
description = "Auditable CUDA full-parameter comparison harness for Latent Workspace experiments"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "numpy==2.5.2",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "transformers==5.15.0",
  "triton==3.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "src/latent_workspace_ft_v10/engine.py",
  "provenance/source_snapshots",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
